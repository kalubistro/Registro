<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Herramienta de registro Kalu bistró café</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: cabecera con logo + pestañas (Resumen · Registro · Tablero); contenido en una columna ancha, tabla con scroll propio */
:root{
  --bg:#F1E3D1; --surface:#FAF4EA; --surface-2:#EBD9C3; --ink:#34161F; --muted:#76564F; --line:#D9C0A3;
  --accent:#C8095A; --accent-ink:#FFFFFF; --caramel:#B3641F; --caramel-fill:#CF8F4F;
  --good:#2B7A52; --info:#3A6BA5; --warn:#B3641F; --neutral:#7A6A66;
  --shadow:0 1px 2px rgba(52,22,31,.08),0 8px 24px rgba(52,22,31,.06);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1216; --surface:#281A20; --surface-2:#33222A; --ink:#F3E5D6; --muted:#C2A9A0; --line:#4A3239;
  --accent:#F0508A; --accent-ink:#1C1216; --caramel:#E3A765; --caramel-fill:#D9954F;
  --good:#5CC08C; --info:#7FAEE4; --warn:#E3A765; --neutral:#B3A29D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1216; --surface:#281A20; --surface-2:#33222A; --ink:#F3E5D6; --muted:#C2A9A0; --line:#4A3239;
  --accent:#F0508A; --accent-ink:#1C1216; --caramel:#E3A765; --caramel-fill:#D9954F;
  --good:#5CC08C; --info:#7FAEE4; --warn:#E3A765; --neutral:#B3A29D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

/* Cabecera */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:20px 12px}
.logo{width:76px;height:76px;border-radius:16px;box-shadow:var(--shadow);flex:none;display:block}
.brand{flex:1;min-width:220px}
.brand .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:clamp(26px,4.4vw,38px);color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.sync.local i{background:var(--warn)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
nav.tabs button{background:none;border:0;padding:10px 16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;letter-spacing:.02em}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:hover{color:var(--ink)}
.view[hidden]{display:none}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}

/* Tarjetas / secciones */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:22px;margin-bottom:4px}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--accent)}
.kpi .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}

/* Barras */
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,200px) 1fr 38px;gap:10px;align-items:center;font-size:13px}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bar .t{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .t b{display:block;height:100%;border-radius:6px;background:var(--caramel-fill)}
.bar .t b.alta{background:var(--accent)}
.bar .t b.media{background:var(--caramel-fill)}
.bar .t b.baja{background:var(--neutral)}
.bar .x{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pipe{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface-2);margin-bottom:12px}
.pipe b{display:block;height:100%}
.estlist{display:grid;gap:6px;font-size:13px}
.estlist div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.estlist span:first-child{display:inline-flex;align-items:center;gap:8px;min-width:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c)}

/* Acciones sugeridas */
.todo{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.todo .tx{min-width:0;overflow-wrap:anywhere}
.todo .tx small{display:block;color:var(--muted)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}

/* Registro */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:200px}
.inp,.sel,.txt{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
.toolbar .sel{width:auto;min-width:150px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:10px 12px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
td.c,th.c{text-align:center}
td.num{font-variant-numeric:tabular-nums}
td.long{max-width:260px;overflow-wrap:anywhere}
td.code{font-weight:600;color:var(--accent);white-space:nowrap}
td.nm{font-weight:600;min-width:190px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.count{color:var(--muted);font-size:12.5px;margin-top:8px}

/* Tablero */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h3{font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 4px 0}
.col h3 .dot{margin-right:6px}
.col h3 em{font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.card .t{font-weight:600;overflow-wrap:anywhere}
.card .m{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);align-items:center}
.card select{font-size:12.5px;padding:5px 8px}

/* Ventana de edición */
.overlay{position:fixed;inset:0;background:rgba(20,8,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:760px;padding:22px;box-shadow:var(--shadow);margin-block:auto}
.modal h2{font-size:28px;color:var(--accent);margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.field label,.field .lab{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.txt{resize:vertical;min-height:64px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 0;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.seg button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.avgbox{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.avgbox strong{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.actions .sp{flex:1}
.err{color:var(--accent);font-size:12.5px;margin-top:4px}
.opts{display:grid;gap:10px;margin-top:12px}
.opts .btn{justify-content:flex-start;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:90;max-width:calc(100% - 32px)}
.foot{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:640px){
  .form{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:minmax(80px,120px) 1fr 34px}
  .logo{width:60px;height:60px}
  .modal{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.bar .t b,.pipe b{transition:width .5s ease}}
</style>

<script>
(function(){
"use strict";
var LOGO_ALT="Kalu Bistro Café";
var ESTADOS=["Registrada","En evaluación","En revisión","Aprobada para prueba","En ejecución","Descartada o pendiente"];
var ECOL={"Registrada":"var(--neutral)","En evaluación":"var(--info)","En revisión":"var(--warn)","Aprobada para prueba":"var(--good)","En ejecución":"var(--accent)","Descartada o pendiente":"var(--muted)"};
var CRIT=[["valor","Valor cliente (1-5)"],["viabilidad","Viabilidad (1-5)"],["costo","Costo (1-5)"],["tiempo","Tiempo (1-5)"],["beneficio","Beneficio (1-5)"]];
var HEAD=["Código","Nombre de la idea","Descripción","Origen"].concat(CRIT.map(function(c){return c[1]}),["Promedio","Recursos necesarios","Fecha prevista","Estado","Resultados","Aprendizajes"]);
var SEED=[
["I-001","Nuevo sabor de matcha","Incorporar matcha con compota de fresa.","Redes sociales",5,4,4,4,5,"Ingredientes, empaque","2025-05-15","En ejecución"],
["I-002","Taller de decoración de galletas","Taller práctico para niños y adultos.","Clientes",4,4,3,3,4,"Materiales, publicidad","2025-06-01","Registrada"],
["I-003","Snack bar para eventos","Servicio de bocadillos y postres en fiestas.","Clientes",4,5,4,4,4,"Ingredientes, transporte","2025-06-10","Aprobada para prueba"],
["I-004","Bebida de temporada","Frappé de frutas tropicales con toppings.","Tendencias",5,3,3,3,4,"Ingredientes, vasos","2025-06-20","En evaluación"],
["I-005","Promoción en redes","Descuentos en combos del día.","Redes sociales",4,3,5,5,3,"Diseño, publicidad","2025-07-05","Registrada"],
["I-006","Nuevos postres sin azúcar","Opciones saludables para clientes.","Clientes",4,4,3,3,4,"Ingredientes, recetas","2025-07-15","Descartada o pendiente"],
["I-007","Menú de desayunos","Desayunos especiales los fines de semana.","Observación competencia",4,4,4,3,4,"Ingredientes, publicidad","2025-08-01","En revisión"],
["I-008","Pack de productos","Combos de café + postre para llevar.","Clientes",5,4,4,4,4,"Empaques, materiales","2025-08-15","Aprobada para prueba"]
].map(function(r){return {codigo:r[0],nombre:r[1],descripcion:r[2],origen:r[3],valor:r[4],viabilidad:r[5],costo:r[6],tiempo:r[7],beneficio:r[8],recursos:r[9],fecha:r[10],estado:r[11],resultados:"",aprendizajes:""}});

var S={ideas:[],mode:"local",db:null,tab:"resumen"};
var $=function(s){return document.querySelector(s)};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

/* ---------- Cálculos automáticos ---------- */
function prom(i){var v=CRIT.map(function(c){return i[c[0]]}).filter(function(x){return typeof x==="number"&&x>=1});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:null}
function fmt(n){return n==null?"—":n.toFixed(1).replace(".",",")}
function prio(p){if(p==null)return {k:"baja",t:"Sin calificar",c:"var(--neutral)"};if(p>=4.2)return {k:"alta",t:"Prioridad alta",c:"var(--accent)"};if(p>=3.6)return {k:"media",t:"Prioridad media",c:"var(--caramel)"};return {k:"baja",t:"Prioridad baja",c:"var(--neutral)"}}
function fdate(s){if(!s)return "—";var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?m[3]+"/"+m[2]+"/"+m[1]:s}
function nextCode(){var mx=0;S.ideas.forEach(function(i){var m=/(\d+)$/.exec(i.codigo||"");if(m)mx=Math.max(mx,+m[1])});return "I-"+String(mx+1).padStart(3,"0")}
function chip(e){return '<span class="chip" style="--c:'+(ECOL[e]||"var(--neutral)")+'">'+esc(e||"—")+'</span>'}
function promPill(i){var p=prom(i),r=prio(p);return '<span class="pill" style="--c:'+r.c+'" title="'+r.t+'"><i></i>'+fmt(p)+'</span>'}
function byCode(a,b){return String(a.codigo).localeCompare(String(b.codigo),"es",{numeric:true})}

/* ---------- Almacenamiento ---------- */
var LS="kalu-registro-ideas-v1";
function lsLoad(){try{var r=localStorage.getItem(LS);if(r){var a=JSON.parse(r);if(Array.isArray(a))return a}}catch(e){}return null}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S.ideas))}catch(e){}}
function clean(o){var d={};["codigo","nombre","descripcion","origen","valor","viabilidad","costo","tiempo","beneficio","recursos","fecha","estado","resultados","aprendizajes"].forEach(function(k){var v=o[k];d[k]=(v==null?(CRIT.some(function(c){return c[0]===k})?null:""):v)});return d}
function setSync(){var el=$("#sync");el.classList.toggle("local",S.mode!=="db");$("#syncTxt").textContent=S.mode==="db"?"Guardado automáticamente":"Guardado en este navegador"}
function upsertLocal(o){var k=S.ideas.findIndex(function(x){return x.codigo===o.codigo});if(k>=0)S.ideas[k]=o;else S.ideas.push(o)}
function saveIdea(o){
  o=clean(o);upsertLocal(o);renderAll();
  if(S.mode==="db"){return S.db.collection("ideas").doc(o.codigo).set(o).catch(function(){toast("No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.")})}

/* ---------- Resumen ---------- */
function barRow(name,val,max,cls,label){var w=max?Math.max(0,Math.min(100,val/max*100)):0;return '<div class="bar"><span class="n" title="'+esc(name)+'">'+esc(name)+'</span><span class="t"><b class="'+(cls||"")+'" style="width:'+w+'%"></b></span><span class="x">'+esc(label)+'</span></div>'}
function suggestions(){
  var out=[];
  S.ideas.slice().sort(byCode).forEach(function(i){
    var p=prom(i),r=(i.resultados||"").trim(),a=(i.aprendizajes||"").trim(),e=i.estado;
    if(e==="Registrada"&&p!=null&&p>=3.8)out.push([i,"Pasar a evaluación","Promedio "+fmt(p)+", buen punto de partida."]);
    else if(e==="En evaluación")out.push([i,"Completar la evaluación","Revisar viabilidad, costo y tiempo."]);
    else if(e==="En revisión")out.push([i,"Decidir si se aprueba para prueba","Promedio "+fmt(p)+"."]);
    else if(e==="Aprobada para prueba"&&!r)out.push([i,"Registrar resultados de la prueba","Aún sin resultados."]);
    else if(e==="En ejecución"&&(!r||!a))out.push([i,"Registrar resultados y aprendizajes","Falta "+(!r&&!a?"resultados y aprendizajes":!r?"resultados":"aprendizajes")+"."]);
    else if(e==="Descartada o pendiente"&&p!=null&&p>=4)out.push([i,"Revisar si conviene retomarla","Promedio "+fmt(p)+" pese a estar pendiente."]);
  });
  return out;
}

/* ---------- Excel ---------- */
function serial(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");if(!m)return null;return Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-Date.UTC(1899,11,30))/864e5)}
function fromSerial(v){
  if(v==null||v==="")return "";
  if(typeof v==="number"){var d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
  var s=String(v).trim(),m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
  return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:"";
}
function exportXlsx(){
  if(!window.XLSX){toast("La librería de Excel no cargó. Revisa tu conexión.");return}
  var L=S.ideas.slice().sort(byCode),rows=[HEAD];
  L.forEach(function(i){rows.push([i.codigo,i.nombre,i.descripcion,i.origen,i.valor,i.viabilidad,i.costo,i.tiempo,i.beneficio,null,i.recursos,serial(i.fecha),i.estado,i.resultados||"-",i.aprendizajes||"-"])});
  var ws=XLSX.utils.aoa_to_sheet(rows);
  L.forEach(function(i,k){var r=k+2,p=prom(i);ws["J"+r]={t:p==null?"s":"n",v:p==null?"":p,f:'IF(COUNT(E'+r+':I'+r+')=0,"",AVERAGE(E'+r+':I'+r+'))'};if(ws["L"+r]&&ws["L"+r].t==="n")ws["L"+r].z="dd/mm/yyyy";if(ws["J"+r]&&p!=null)ws["J"+r].z="0.0"});
  ws["!cols"]=[18,26,34,20,10,11,9,9,11,10,24,13,22,13,15].map(function(w){return {wch:w}});
  ws["!freeze"]={xSplit:0,ySplit:1};
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Registro");
  var out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  var blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  Promise.resolve(window.claude&&window.claude.use?window.claude.use("downloads"):null).then(function(dl){
    if(!dl){toast("La descarga no está disponible en esta vista.");return}
    return dl.save({filename:"Registro_Kalu_bistro_cafe.xlsx",data:blob}).then(function(){toast("Excel listo")},function(e){if(!e||e.code!=="declined")toast("No se pudo descargar el archivo.")});
  }).catch(function(){toast("No se pudo descargar el archivo.")});
}
var pending=null;
function importFile(f){
  if(!f)return;if(!window.XLSX){toast("La librería de Excel no cargó. Revisa tu conexión.");return}
  var rd=new FileReader();
  rd.onerror=function(){toast("No se pudo leer el archivo.")};
  rd.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:"array"});
      var ws=wb.Sheets["Registro"]||wb.Sheets[wb.SheetNames[0]];
      var A=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
      var hr=A.findIndex(function(r){return r&&r.some(function(c){return String(c||"").trim()==="Código"})});
      if(hr<0)throw new Error("sin encabezados");
      var num=function(v){v=Number(v);return v>=1&&v<=5?Math.round(v):null};
      var out=[];
      A.slice(hr+1).forEach(function(r){
        if(!r||!r[0]||!String(r[0]).trim())return;
        var dash=function(v){v=v==null?"":String(v).trim();return v==="-"?"":v};
        out.push({codigo:String(r[0]).trim(),nombre:dash(r[1]),descripcion:dash(r[2]),origen:dash(r[3]),valor:num(r[4]),viabilidad:num(r[5]),costo:num(r[6]),tiempo:num(r[7]),beneficio:num(r[8]),recursos:dash(r[10]),fecha:fromSerial(r[11]),estado:ESTADOS.indexOf(dash(r[12]))>=0?dash(r[12]):"Registrada",resultados:dash(r[13]),aprendizajes:dash(r[14])});
      });
      if(!out.length)throw new Error("vacío");
      pending=out;
      $("#layer").innerHTML='<div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="it" style="max-width:520px"><h2 id="it">Importar '+out.length+' ideas</h2><p>¿Qué hacemos con las ideas que ya tienes registradas?</p><div class="opts"><button class="btn" data-action="imp-merge"><span><b>Combinar</b><br><small>Agrega las nuevas y actualiza las que tengan el mismo código.</small></span></button><button class="btn" data-action="imp-replace"><span><b>Reemplazar todo</b><br><small>Borra el registro actual y deja solo lo importado.</small></span></button></div><div class="actions"><button class="btn" data-action="close">Cancelar</button></div></div></div>';
    }catch(e){toast("No se pudo leer el Excel. Usa un archivo con la hoja Registro y sus títulos.")}
  };
  rd.readAsArrayBuffer(f);
}
function doImport(replace){
  var out=pending;pending=null;closeEditor();if(!out)return;
  var old=S.ideas.map(function(i){return i.codigo});
  if(replace)S.ideas=[];
  out.forEach(upsertLocal);renderAll();
  if(S.mode==="db"){
    var ops=out.map(function(o){return S.db.collection("ideas").doc(o.codigo).set(clean(o))});
    if(replace)old.forEach(function(c){if(!out.some(function(o){return o.codigo===c}))ops.push(S.db.collection("ideas").doc(c).delete())});
    Promise.all(ops).then(function(){toast(out.length+" ideas importadas")},function(){toast("Algunas ideas no se guardaron.")});
  }else{lsSave();toast(out.length+" ideas importadas")}
}

    else if(k==="del"){
      if(!delArmed){delArmed=true;a.textContent="Confirmar eliminación";a.style.background="var(--accent)";a.style.color="var(--accent-ink)"}
      else{var c=cur.codigo;delArmed=false;closeEditor();deleteIdea(c).then(function(){toast("Idea "+c+" eliminada")})}
    }
    return;
  }
  var s=e.target.closest(".seg button");
  if(s&&cur){var g=s.parentNode.getAttribute("data-k"),v=+s.getAttribute("data-v");cur[g]=cur[g]===v?null:v;
    [].forEach.call(s.parentNode.children,function(b){b.setAttribute("aria-checked",String(+b.getAttribute("data-v")===cur[g]))});updAvg();return}
  var o=e.target.closest("[data-open]");
  if(o&&!e.target.closest("select")){openEditor(o.getAttribute("data-open"));return}
  if(e.target.id==="ov"){closeEditor()}
});
document.addEventListener("change",function(e){
  var m=e.target.closest("[data-move]");
  if(m){var i=S.ideas.find(function(x){return x.codigo===m.getAttribute("data-move")});if(i){var o=Object.assign({},i,{estado:m.value});saveIdea(o).then(function(){toast(i.codigo+" pasó a "+m.value)})}}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#layer").innerHTML){pending=null;closeEditor()}});
["q","fEstado","fOrigen","fOrden"].forEach(function(id){$("#"+id).addEventListener("input",renderTable)});
$("#file").addEventListener("change",function(e){importFile(e.target.files[0]);e.target.value=""});
document.addEventListener("submit",function(e){e.preventDefault()});
window.addEventListener("hashchange",function(){showTab(location.hash.slice(1))});

showTab(location.hash.slice(1));
initStore();
})();
</script>
